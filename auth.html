<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - La Familia DE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-page-wrap">
    <div class="auth-card">
      <img class="auth-logo" src="https://i.imgur.com/lq2S7Mf.png" alt="La Familia Logo" />
      <h1>La Familia DE</h1>
      <p>Anmelden oder ohne Anmeldung fortfahren.</p>

      <div class="auth-tabs">
        <button data-auth-tab="login" class="active">Anmelden</button>
        <button data-auth-tab="guest">Ohne Anmeldung fortfahren</button>
      </div>

      <form id="login-form" class="auth-form active">
        <label>Username <input name="username" required /></label>
        <label>Code / Passwort <input name="password" type="password" required /></label>
        <button class="btn" type="submit">Anmelden</button>
      </form>

      <div id="guest-pane" class="auth-form">
        <p>Als Gast bleiben Karte und Galerie gesperrt.</p>
        <button id="continue-guest" type="button" class="btn ghost">Ohne Anmeldung fortfahren</button>
      </div>

      <p id="auth-message" class="auth-message"></p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
